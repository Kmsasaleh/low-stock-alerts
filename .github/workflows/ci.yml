name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      RAILS_ENV: test
      BUNDLE_WITHOUT: production
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.12"
          bundler-cache: true
          working-directory: web
      - run: bin/rails db:schema:load
      - run: bin/rails test

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      BUNDLE_WITHOUT: production
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.12"
          bundler-cache: true
          working-directory: web
      - run: bundle exec rubocop
